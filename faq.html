<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>자주 묻는 질문(FAQ) | 그린 크레딧</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="faq-page">
  <div class="faq-overlay">
    <div class="faq-card">
      <h1>자주 묻는 질문(FAQ)</h1>

      <div class="faq-item">
        <div class="faq-q">Q. 포인트는 언제 지급되나요?</div>
        <div class="faq-a">A. 인증이 승인된 후 24시간 이내 자동 지급됩니다.</div>
      </div>

      <div class="faq-item">
        <div class="faq-q">Q. 포인트 유효기간이 있나요?</div>
        <div class="faq-a">A. 적립일로부터 1년간 유효하며 이후 자동 소멸합니다.</div>
      </div>

      <div class="faq-item">
        <div class="faq-q">Q. 로그인이 안돼요.</div>
        <div class="faq-a">
          A. 입력한 이메일이나 비밀번호가 정확한지 확인해주세요.<br>
          그래도 안된다면 비밀번호를 재설정하시거나 고객센터로 문의해주세요.
        </div>
      </div>

      <div class="faq-item">
        <div class="faq-q">Q. 회원 탈퇴는 어떻게 하나요?</div>
        <div class="faq-a">A. [내 정보] → [계정 설정] → [회원 탈퇴]에서 직접 탈퇴할 수 있습니다.</div>
      </div>
    </div>
  </div>
</body>
</html>
