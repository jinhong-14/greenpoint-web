<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 | 그린 크레딧</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-wrapper">
    <h1 class="login-title">회원가입</h1>

    <form class="login-form" onsubmit="return false;">
      <label for="signup-email">이메일</label>
      <input type="email" id="signup-email" placeholder="이메일 입력" required />

      <label for="signup-password">비밀번호</label>
      <input type="password" id="signup-password" placeholder="비밀번호 입력" required />

      <label for="signup-confirm">비밀번호 확인</label>
      <input type="password" id="signup-confirm" placeholder="비밀번호 재입력" required />

      <button id="signupBtn" class="login-btn">회원가입</button>
      <p class="login-msg" id="signupMsg"></p>
    </form>

    <div class="login-links">
      <a href="login.html" class="signup-link">이미 계정이 있으신가요? 로그인</a>
    </div>
  </main>

  <script>
    document.getElementById("signupBtn").addEventListener("click", () => {
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      const confirm = document.getElementById("signup-confirm").value;
      const msg = document.getElementById("signupMsg");

      if (!email || !password || !confirm) {
        msg.textContent = "모든 항목을 입력해주세요.";
        return;
      }

      if (password !== confirm) {
        msg.textContent = "비밀번호가 일치하지 않습니다.";
        return;
      }

      // 이미 등록된 이메일인지 확인
      const existingUser = localStorage.getItem(email);
      if (existingUser) {
        msg.textContent = "이미 등록된 이메일입니다.";
        return;
      }

      // localStorage에 저장
      localStorage.setItem(email, password);
      msg.textContent = "회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.";

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1500);
    });
  </script>
</body>
</html>
