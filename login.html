<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | 그린 크레딧</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-wrapper">
    <h1 class="login-title">로그인</h1>

    <form class="login-form" onsubmit="return false;">
      <label for="email">아이디</label>
      <input type="email" id="email" placeholder="이메일 입력" />

      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호 입력" />

      <button id="loginBtn" class="login-btn">로그인</button>
      <p class="login-msg" id="loginMsg"></p>
    </form>

    <div class="login-links">
      <a href="signup.html" class="signup-link">새로 가입하기</a>
      <a href="#" class="findpw-link">비밀번호를 잊어버리셨나요?</a>
    </div>
  </main>

  <script>
    document.getElementById("loginBtn").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("loginMsg");
  
      // localStorage에서 저장된 회원 정보 확인
      const storedPassword = localStorage.getItem(email);
  
      if (storedPassword && storedPassword === password) {
        // 로그인 성공
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userEmail", email);
        window.location.href = "index.html";
      } else {
        msg.textContent = "아이디 또는 비밀번호가 잘못되었습니다.";
      }
    });
  </script>
  
</body>
</html>
