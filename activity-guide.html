<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>활동 참여 안내 | 그린 크레딧</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      font-family: 'Pretendard', sans-serif;
      color: #111;
    }

    header {
      width: 100%;
      background: #232527;
      color: white;
      padding: 16px 0;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      position: relative;
    }

    .header-dots {
      position: absolute;
      left: 16px;
      top: 14px;
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #ffbd2f; }
    .dot.green { background: #28c840; }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    img.guide-img {
      max-width: 1000px;
      width: 95%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      margin-top: 30px;
    }

    footer {
      text-align: center;
      padding: 20px 0 40px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    서비스 소개
  </header>

  <main>
    <h1>활동 참여 안내</h1>
    <img src="KakaoTalk_20251016_183059239_04.png" alt="활동 참여 안내" class="guide-img" />
  </main>

  <footer>
    © 2025 Green Credit. 모든 권리 보유.
  </footer>
</body>
</html>
